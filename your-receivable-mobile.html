<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Your Receivable Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
#arMobileFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#17457a;font-weight:800;font-size:13px;z-index:20}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">Loading Your Receivable…</div>
<iframe id="arMobileFrame" src="your-receivable.html?embed=1&view=your&mobileSkin=1&v=20260914-10" title="Your Receivable"></iframe>
<script>
(function(){
'use strict';

const frame=document.getElementById('arMobileFrame');
const boot=document.getElementById('boot');
const CARD_CSS_CACHE='bb_ar_mobile_cards_css_v1_20260914';

const HEADER_FILTER_CSS=`
/* BIG BROTHER — Your Receivable Mobile Header + Filter V2
   IMPORTANT: no invoice-card selectors are changed here. */

:root{
  --bb2-blue:#1768d5;
  --bb2-navy:#123f78;
  --bb2-deep:#0e4e8e;
  --bb2-bg:#f4f7fb;
  --bb2-line:#dce6f1;
  --bb2-muted:#708196;
}

.wrap{padding-top:8px!important}

.topbar{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:8px!important;
  margin:0 0 8px!important;
  padding:10px 11px!important;
  border-radius:14px!important;
  background:linear-gradient(135deg,var(--bb2-navy),#1769b8 70%,#2080c8)!important;
  box-shadow:0 4px 12px rgba(18,63,120,.12)!important;
}

.topbar>div:first-child{min-width:0!important}
.topbar>div:first-child h1{
  margin:0 0 2px!important;
  color:#fff!important;
  font-size:18px!important;
  line-height:1.08!important;
  font-weight:900!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
.topbar .subtitle{
  margin:0!important;
  color:rgba(255,255,255,.78)!important;
  font-size:9px!important;
  line-height:1.25!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
.topbar .userbox{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:5px!important;min-width:0!important}
#accessPill,#logoutBtn{display:none!important}
#locationPill{
  max-width:116px!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
  padding:6px 8px!important;
  border:1px solid rgba(255,255,255,.28)!important;
  background:rgba(255,255,255,.10)!important;
  color:#fff!important;
  font-size:8.5px!important;
}

.view-banner{display:none!important}

.bb-mobile-actionbar{
  display:grid!important;
  grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 38px!important;
  gap:6px!important;
  margin:0 0 8px!important;
}
.bb-mobile-actionbar .btn,
.bb-filter-toggle,
.bb-refresh-btn{
  min-width:0!important;
  min-height:38px!important;
  padding:6px 5px!important;
  border-radius:10px!important;
  font-size:8.8px!important;
  line-height:1.12!important;
  font-weight:900!important;
  white-space:normal!important;
}
.bb-filter-toggle{
  border:1px solid #cfe0f4!important;
  background:#eef6ff!important;
  color:#1763be!important;
}
.bb-filter-toggle.active{
  border-color:#1768d5!important;
  background:#1768d5!important;
  color:#fff!important;
}
.bb-mobile-actionbar #summaryBtn{background:#173f77!important;color:#fff!important}
.bb-mobile-actionbar #batchBtn{background:#198754!important;color:#fff!important}
.bb-mobile-actionbar .btn:disabled{opacity:.48!important}
.bb-refresh-btn{border:1px solid #d8e1eb!important;background:#fff!important;color:#50657c!important}

.bb-filter-backdrop{
  position:fixed!important;
  inset:0!important;
  z-index:8998!important;
  background:rgba(8,25,45,.38)!important;
  opacity:0!important;
  pointer-events:none!important;
  transition:opacity .18s ease!important;
}
.bb-filter-backdrop.open{opacity:1!important;pointer-events:auto!important}

.filters.bb-mobile-filter-panel{
  position:fixed!important;
  left:0!important;
  right:0!important;
  bottom:0!important;
  z-index:8999!important;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:8px!important;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom))!important;
  border:0!important;
  border-radius:20px 20px 0 0!important;
  background:#fff!important;
  box-shadow:0 -16px 42px rgba(8,31,56,.22)!important;
  transform:translateY(105%)!important;
  transition:transform .20s ease!important;
}
.filters.bb-mobile-filter-panel.open{transform:translateY(0)!important}
.filters.bb-mobile-filter-panel .bb-filter-head{
  grid-column:1/-1!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:8px!important;
  margin-bottom:1px!important;
}
.bb-filter-head strong{font-size:15px!important;color:#123f78!important}
.bb-filter-head span{font-size:9px!important;color:#7a899a!important}
.bb-filter-close{
  width:32px!important;
  height:32px!important;
  min-height:32px!important;
  border:0!important;
  border-radius:50%!important;
  background:#edf2f7!important;
  color:#53687f!important;
  font-size:16px!important;
}
.filters.bb-mobile-filter-panel input,
.filters.bb-mobile-filter-panel select{
  min-width:0!important;
  width:100%!important;
  min-height:42px!important;
  padding:8px 9px!important;
  border-radius:10px!important;
  font-size:11px!important;
}
.filters.bb-mobile-filter-panel input{grid-column:1/-1!important}
.bb-filter-clear{
  grid-column:1/-1!important;
  min-height:40px!important;
  border:1px solid #d8e2ec!important;
  border-radius:10px!important;
  background:#f7f9fc!important;
  color:#50657c!important;
  font-size:10px!important;
  font-weight:900!important;
}

@media(max-width:390px){
  .topbar{padding:9px 10px!important}
  .topbar>div:first-child h1{font-size:17px!important}
  #locationPill{max-width:96px!important}
  .bb-mobile-actionbar{grid-template-columns:66px minmax(0,1fr) minmax(0,1fr) 36px!important;gap:5px!important}
  .bb-mobile-actionbar .btn,.bb-filter-toggle,.bb-refresh-btn{font-size:8.2px!important;padding:5px 4px!important}
  .filters.bb-mobile-filter-panel{grid-template-columns:1fr!important}
  .filters.bb-mobile-filter-panel input,.filters.bb-mobile-filter-panel select,.filters.bb-mobile-filter-panel .bb-filter-head,.bb-filter-clear{grid-column:1!important}
}
`;

function extractOldMobileCss(text){
  const marker='const MOBILE_CSS = `';
  const start=text.indexOf(marker);
  if(start<0)return'';
  const bodyStart=start+marker.length;
  const end=text.indexOf('\n`;',bodyStart);
  return end>bodyStart?text.slice(bodyStart,end):'';
}

async function loadCardCss(){
  try{
    const cached=localStorage.getItem(CARD_CSS_CACHE);
    if(cached)return cached;
  }catch(_){ }

  try{
    const res=await fetch('your-receivable-mobile-cards-v1.html?v=20260914-1',{cache:'force-cache'});
    if(!res.ok)throw new Error('card skin fetch failed');
    const text=await res.text();
    const css=extractOldMobileCss(text);
    if(css){
      try{localStorage.setItem(CARD_CSS_CACHE,css)}catch(_){ }
      return css;
    }
  }catch(error){
    console.warn('BIG BROTHER card skin cache:',error);
  }
  return'';
}

const cardCssPromise=loadCardCss();

function cleanSummaryTable(doc){
  const table=doc.querySelector('#summarySheet .sum-table');
  if(!table)return;
  table.querySelectorAll('tr').forEach(row=>{
    if(row.children.length>=7&&row.children[3])row.children[3].remove();
  });
}

function fitSummaryToPhone(doc){
  const overlay=doc.getElementById('summaryOverlay');
  const sheet=doc.getElementById('summarySheet');
  if(!overlay||!sheet||overlay.classList.contains('hidden'))return;
  const available=Math.max(280,doc.documentElement.clientWidth-16);
  const scale=Math.min(1,available/794);
  sheet.style.transformOrigin='top left';
  sheet.style.transform='scale('+scale+')';
  const natural=sheet.scrollHeight||1123;
  let spacer=doc.getElementById('bb-summary-height-spacer');
  if(!spacer){
    spacer=doc.createElement('div');
    spacer.id='bb-summary-height-spacer';
    spacer.style.width='1px';
    spacer.style.pointerEvents='none';
    sheet.insertAdjacentElement('afterend',spacer);
  }
  spacer.style.height=Math.ceil(natural*scale)+'px';
  spacer.style.marginTop=Math.ceil(natural*scale-natural)+'px';
}

function activeFilterCount(doc){
  return ['searchBox','customerFilter','locationFilter','currencyFilter','statusFilter']
    .map(id=>doc.getElementById(id))
    .filter(el=>el&&String(el.value||'').trim()).length;
}

function buildFilterUI(doc,win){
  const filters=doc.querySelector('.filters');
  if(!filters||doc.getElementById('bbFilterToggle'))return;

  const summary=doc.getElementById('summaryBtn');
  const batch=doc.getElementById('batchBtn');
  const refresh=[...filters.querySelectorAll('button')].find(btn=>String(btn.getAttribute('onclick')||'').includes('loadAR(true)'));
  if(!summary||!batch||!refresh)return;

  const bar=doc.createElement('div');
  bar.className='bb-mobile-actionbar';

  const filterBtn=doc.createElement('button');
  filterBtn.id='bbFilterToggle';
  filterBtn.className='bb-filter-toggle';
  filterBtn.type='button';

  refresh.classList.add('bb-refresh-btn');
  refresh.textContent='↻';
  refresh.setAttribute('aria-label','Refresh receivables');

  filters.parentNode.insertBefore(bar,filters);
  bar.append(filterBtn,summary,batch,refresh);

  filters.classList.add('bb-mobile-filter-panel');

  const head=doc.createElement('div');
  head.className='bb-filter-head';
  head.innerHTML='<div><strong>Filters</strong><br><span>Invoice · Customer · Location · Currency · Status</span></div><button type="button" class="bb-filter-close" aria-label="Close filters">×</button>';
  filters.prepend(head);

  const clear=doc.createElement('button');
  clear.type='button';
  clear.className='bb-filter-clear';
  clear.textContent='Clear Filters';
  filters.appendChild(clear);

  const backdrop=doc.createElement('div');
  backdrop.className='bb-filter-backdrop';
  doc.body.appendChild(backdrop);

  function syncFilterButton(){
    const n=activeFilterCount(doc);
    filterBtn.textContent=n?'⚙ Filters · '+n:'⚙ Filters';
    filterBtn.classList.toggle('active',n>0);
  }

  function openFilters(){
    filters.classList.add('open');
    backdrop.classList.add('open');
  }

  function closeFilters(){
    filters.classList.remove('open');
    backdrop.classList.remove('open');
  }

  filterBtn.addEventListener('click',openFilters);
  backdrop.addEventListener('click',closeFilters);
  head.querySelector('.bb-filter-close').addEventListener('click',closeFilters);

  ['locationFilter','currencyFilter','statusFilter'].forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('change',()=>{
      syncFilterButton();
      setTimeout(closeFilters,120);
    });
  });

  ['searchBox','customerFilter'].forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('input',syncFilterButton);
    el.addEventListener('change',()=>{
      syncFilterButton();
      setTimeout(closeFilters,120);
    });
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'){
        syncFilterButton();
        closeFilters();
        try{el.blur()}catch(_){ }
      }
    });
  });

  clear.addEventListener('click',()=>{
    ['searchBox','customerFilter','locationFilter','currencyFilter','statusFilter'].forEach(id=>{
      const el=doc.getElementById(id);
      if(el)el.value='';
    });
    try{if(typeof win.filterChanged==='function')win.filterChanged()}catch(_){ }
    syncFilterButton();
    closeFilters();
  });

  syncFilterButton();
}

function wireSummary(doc,win){
  const sheet=doc.getElementById('summarySheet');
  if(sheet&&!sheet.__bbFastMobileObserved){
    sheet.__bbFastMobileObserved=true;
    new win.MutationObserver(()=>{
      win.requestAnimationFrame(()=>{
        cleanSummaryTable(doc);
        setTimeout(()=>fitSummaryToPhone(doc),20);
      });
    }).observe(sheet,{childList:true,subtree:true});
  }

  const overlay=doc.getElementById('summaryOverlay');
  if(overlay&&!overlay.__bbFastMobileObserved){
    overlay.__bbFastMobileObserved=true;
    new win.MutationObserver(()=>{
      if(!overlay.classList.contains('hidden')){
        cleanSummaryTable(doc);
        setTimeout(()=>fitSummaryToPhone(doc),40);
      }
    }).observe(overlay,{attributes:true,attributeFilter:['class']});
  }
}

async function enhance(){
  let doc,win;
  try{
    doc=frame.contentDocument||frame.contentWindow.document;
    win=frame.contentWindow;
  }catch(_){return false}
  if(!doc||!doc.head||!doc.getElementById('arBody'))return false;

  const cardCss=await cardCssPromise;

  let cardStyle=doc.getElementById('bb-mobile-receivable-skin');
  if(!cardStyle){
    cardStyle=doc.createElement('style');
    cardStyle.id='bb-mobile-receivable-skin';
    doc.head.appendChild(cardStyle);
  }
  if(cardCss)cardStyle.textContent=cardCss;

  let headerStyle=doc.getElementById('bb-mobile-receivable-header-v2');
  if(!headerStyle){
    headerStyle=doc.createElement('style');
    headerStyle.id='bb-mobile-receivable-header-v2';
    doc.head.appendChild(headerStyle);
  }
  headerStyle.textContent=HEADER_FILTER_CSS;

  buildFilterUI(doc,win);
  wireSummary(doc,win);
  cleanSummaryTable(doc);

  boot.classList.add('hide');
  return true;
}

function scheduleEnhance(){
  let tries=0;
  const run=async()=>{
    tries++;
    const ok=await enhance();
    if(!ok&&tries<20)setTimeout(run,100);
  };
  run();
}

frame.addEventListener('load',scheduleEnhance);
setTimeout(scheduleEnhance,120);

})();
</script>
</body>
</html>
