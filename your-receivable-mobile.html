function cleanSummary(doc){
  const sheet=doc.getElementById('summarySheet');
  if(!sheet)return;
  const table=sheet.querySelector('.sum-table');
  if(!table)return;
  table.querySelectorAll('tr').forEach(row=>{
    const cells=[...row.children];
    if(cells.length===7)cells[3].remove();
  });
  const widths=['6%','22%','18%','19%','16%','19%'];
  table.querySelectorAll('tr').forEach(row=>{
    [...row.children].forEach((cell,i)=>{if(widths[i])cell.style.width=widths[i]});
  });
  sheet.dataset.bbMobileSummary='1';
}

function fitSummary(doc){
  const overlay=doc.getElementById('summaryOverlay');
  if(!overlay||overlay.classList.contains('hidden'))return;
  const modal=overlay.querySelector('.summary-modal');
  if(!modal)return;
  const available=Math.max(280,modal.clientWidth-16);
  const scale=Math.min(1,available/720);
  overlay.style.setProperty('--bb-summary-zoom',String(scale));
}

function wireSummary(doc,win){
  const sheet=doc.getElementById('summarySheet');
  const overlay=doc.getElementById('summaryOverlay');
  if(sheet&&!sheet.__bbSummaryObserved){
    sheet.__bbSummaryObserved=true;
    new win.MutationObserver(()=>win.requestAnimationFrame(()=>{cleanSummary(doc);fitSummary(doc)})).observe(sheet,{childList:true,subtree:true});
  }
  if(overlay&&!overlay.__bbSummaryObserved){
    overlay.__bbSummaryObserved=true;
    new win.MutationObserver(()=>win.requestAnimationFrame(()=>{cleanSummary(doc);fitSummary(doc)})).observe(overlay,{attributes:true,attributeFilter:['class']});
  }
  if(!win.__bbSummaryResize){
    win.__bbSummaryResize=true;
    win.addEventListener('resize',()=>fitSummary(doc));
  }
  cleanSummary(doc);
  fitSummary(doc);
}

function inject(){
  let doc;
  try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}
  if(!doc||!doc.head)return;
  let style=doc.getElementById('bb-mobile-receivable-skin');
  if(!style){style=doc.createElement('style');style.id='bb-mobile-receivable-skin';doc.head.appendChild(style)}
  style.textContent=MOBILE_CSS;
  try{
    const win=frame.contentWindow;
    const keepFresh=()=>{
      const body=doc.getElementById('arBody');
      if(!body)return;
      body.querySelectorAll('tr').forEach(tr=>{
        const c=tr.children;if(c.length<11)return;
        c[1].title=String(c[1].textContent||'').trim();
        c[2].title='Invoice date';
        c[3].title='Due date';
        c[4].title=String(c[4].textContent||'').trim();
      });
    };
    keepFresh();
    const body=doc.getElementById('arBody');
    if(body&&!body.__bbObserved){body.__bbObserved=true;new win.MutationObserver(()=>win.requestAnimationFrame(keepFresh)).observe(body,{childList:true,subtree:true})}
    wireSummary(doc,win);
  }catch(_){ }
  boot.classList.add('hide');
}

frame.addEventListener('load',()=>{setTimeout(inject,60);setTimeout(inject,400);setTimeout(inject,1200)});
})();
