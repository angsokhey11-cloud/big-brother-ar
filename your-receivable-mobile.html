<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Your Receivable Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
#shellFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#17457a;font-weight:800;font-size:13px;z-index:20}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">Loading Your Receivable…</div>
<iframe id="shellFrame" src="your-receivable-mobile-cards-v1.html?embed=1&v=20260914-1" title="Your Receivable"></iframe>
<script>
(function(){
'use strict';

const shellFrame=document.getElementById('shellFrame');
const boot=document.getElementById('boot');
let nestedFrame=null;

const HEADER_FILTER_CSS=`
/* =========================================================
   BIG BROTHER — YOUR RECEIVABLE MOBILE V2
   HEADER + FILTER ONLY
   IMPORTANT: no #arBody / invoice-card selectors here.
   ========================================================= */

:root{
  --bb2-blue:#1768d5;
  --bb2-navy:#123f78;
  --bb2-deep:#0d4f8f;
  --bb2-line:#dce6f1;
  --bb2-bg:#f4f7fb;
  --bb2-muted:#6f8094;
}

/* Compact inner receivable header. The BIG BROTHER mobile shell stays untouched. */
.topbar{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:9px!important;
  margin:0 0 8px!important;
  padding:10px 11px!important;
  border:0!important;
  border-radius:14px!important;
  background:linear-gradient(135deg,var(--bb2-navy),#1768b7 68%,#2080c8)!important;
  box-shadow:0 4px 12px rgba(18,63,120,.12)!important;
}

.topbar > div:first-child{
  min-width:0!important;
}

.topbar > div:first-child h1{
  margin:0 0 2px!important;
  color:#fff!important;
  font-size:18px!important;
  line-height:1.08!important;
  font-weight:900!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}

.topbar .subtitle{
  margin:0!important;
  color:rgba(255,255,255,.78)!important;
  font-size:9px!important;
  line-height:1.25!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}

.topbar .userbox{
  display:flex!important;
  align-items:center!important;
  justify-content:flex-end!important;
  gap:5px!important;
  flex-wrap:nowrap!important;
  min-width:0!important;
}

#accessPill,
#logoutBtn{
  display:none!important;
}

#locationPill{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  max-width:128px!important;
  min-height:30px!important;
  padding:6px 8px!important;
  border:1px solid rgba(255,255,255,.34)!important;
  border-radius:999px!important;
  background:rgba(255,255,255,.13)!important;
  color:#fff!important;
  font-size:8.5px!important;
  line-height:1.1!important;
  font-weight:900!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}

/* Keep staff/location explanation, but make it small. */
.view-banner{
  margin:0 0 7px!important;
  padding:6px 8px!important;
  border:1px solid #d5e5f7!important;
  border-radius:10px!important;
  background:#edf5ff!important;
  color:#42688f!important;
  font-size:8.5px!important;
  line-height:1.3!important;
  font-weight:700!important;
}

/* New action area. Existing Summary + Direct Request buttons are moved here. */
#bbArMobileTools{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 38px!important;
  gap:6px!important;
  margin:0 0 7px!important;
}

#bbArMobileTools .bb-ar-tools-top{
  display:grid!important;
  grid-template-columns:minmax(0,1fr)!important;
  gap:6px!important;
}

#bbArFilterToggle,
#bbArRefreshBtn{
  min-width:0!important;
  min-height:36px!important;
  border-radius:10px!important;
  font-family:inherit!important;
  font-weight:900!important;
  cursor:pointer!important;
}

#bbArFilterToggle{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:6px!important;
  padding:0 10px!important;
  border:1px solid #c9dbef!important;
  background:#f7fbff!important;
  color:#175ca8!important;
  font-size:10px!important;
}

#bbArFilterToggle[aria-expanded="true"]{
  border-color:#8cb5e4!important;
  background:#eaf4ff!important;
}

#bbArFilterCount{
  display:none!important;
  min-width:17px!important;
  height:17px!important;
  padding:0 4px!important;
  border-radius:999px!important;
  background:var(--bb2-blue)!important;
  color:#fff!important;
  font-size:8px!important;
  line-height:17px!important;
  text-align:center!important;
}

#bbArFilterCount.active{
  display:inline-block!important;
}

#bbArRefreshBtn{
  display:grid!important;
  place-items:center!important;
  padding:0!important;
  border:1px solid #d9e2ed!important;
  background:#fff!important;
  color:#315a85!important;
  font-size:17px!important;
}

#bbArSelectionActions{
  grid-column:1/-1!important;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:6px!important;
}

#bbArSelectionActions #summaryBtn,
#bbArSelectionActions #batchBtn{
  width:100%!important;
  min-width:0!important;
  min-height:38px!important;
  padding:7px 6px!important;
  border-radius:10px!important;
  font-size:9px!important;
  line-height:1.15!important;
  white-space:normal!important;
  text-align:center!important;
}

#bbArSelectionActions #summaryBtn{
  background:#173f77!important;
  color:#fff!important;
}

#bbArSelectionActions #batchBtn{
  background:#198754!important;
  color:#fff!important;
}

#bbArSelectionActions #summaryBtn:disabled,
#bbArSelectionActions #batchBtn:disabled{
  opacity:.48!important;
}

/* The original .filters now contains ONLY real filter fields. */
.filters{
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:6px!important;
  margin:0 0 7px!important;
  padding:8px!important;
  border:1px solid var(--bb2-line)!important;
  border-radius:12px!important;
  background:#fff!important;
  box-shadow:0 3px 12px rgba(20,63,105,.055)!important;
  overflow:hidden!important;
  transform-origin:top!important;
}

.filters.bb-ar-filters-collapsed{
  display:none!important;
}

.filters input,
.filters select{
  width:100%!important;
  min-width:0!important;
  min-height:38px!important;
  padding:7px 8px!important;
  border-radius:9px!important;
  font-size:10px!important;
}

#searchBox,
#customerFilter{
  grid-column:1/-1!important;
}

#statusFilter{
  grid-column:1/-1!important;
}

@media(max-width:390px){
  .topbar{
    padding:9px 9px!important;
  }

  .topbar > div:first-child h1{
    font-size:17px!important;
  }

  #locationPill{
    max-width:112px!important;
    font-size:8px!important;
  }

  #bbArSelectionActions #summaryBtn,
  #bbArSelectionActions #batchBtn{
    font-size:8.5px!important;
  }
}
`;

function innerDocument(){
  try{
    if(!nestedFrame)return null;
    return nestedFrame.contentDocument||nestedFrame.contentWindow.document;
  }catch(_){
    return null;
  }
}

function addStyle(doc){
  let style=doc.getElementById('bb-ar-mobile-header-filter-v2');
  if(!style){
    style=doc.createElement('style');
    style.id='bb-ar-mobile-header-filter-v2';
    doc.head.appendChild(style);
  }
  style.textContent=HEADER_FILTER_CSS;
}

function activeFilterCount(doc){
  const ids=['searchBox','customerFilter','locationFilter','currencyFilter','statusFilter'];
  return ids.reduce((count,id)=>{
    const el=doc.getElementById(id);
    return count+(el&&String(el.value||'').trim()?1:0);
  },0);
}

function enhanceHeaderAndFilters(doc){
  if(!doc?.body||doc.documentElement.dataset.bbArHeaderV2==='1')return false;

  const topbar=doc.querySelector('.topbar');
  const cards=doc.querySelector('.cards');
  const filters=doc.querySelector('.filters');
  const summaryBtn=doc.getElementById('summaryBtn');
  const batchBtn=doc.getElementById('batchBtn');

  if(!topbar||!cards||!filters||!summaryBtn||!batchBtn)return false;

  addStyle(doc);

  let refreshBtn=Array.from(filters.querySelectorAll('button')).find(btn=>/refresh/i.test(String(btn.textContent||'')));

  const tools=doc.createElement('div');
  tools.id='bbArMobileTools';
  tools.innerHTML=`
    <div class="bb-ar-tools-top">
      <button type="button" id="bbArFilterToggle" aria-expanded="false">⚙ Filters <span id="bbArFilterCount"></span></button>
    </div>
    <button type="button" id="bbArRefreshBtn" aria-label="Refresh receivables" title="Refresh">↻</button>
    <div id="bbArSelectionActions"></div>
  `;

  cards.insertAdjacentElement('afterend',tools);

  const actionHost=doc.getElementById('bbArSelectionActions');
  actionHost.appendChild(summaryBtn);
  actionHost.appendChild(batchBtn);

  const compactRefresh=doc.getElementById('bbArRefreshBtn');
  if(refreshBtn){
    compactRefresh.addEventListener('click',()=>refreshBtn.click());
    refreshBtn.remove();
  }else{
    compactRefresh.disabled=true;
  }

  filters.classList.add('bb-ar-filters-collapsed');

  const toggle=doc.getElementById('bbArFilterToggle');
  const countBadge=doc.getElementById('bbArFilterCount');

  function syncFilterBadge(){
    const count=activeFilterCount(doc);
    countBadge.textContent=String(count);
    countBadge.classList.toggle('active',count>0);
  }

  function setOpen(open){
    filters.classList.toggle('bb-ar-filters-collapsed',!open);
    toggle.setAttribute('aria-expanded',open?'true':'false');
    toggle.firstChild.textContent=open?'✕ Hide Filters ':'⚙ Filters ';
    syncFilterBadge();
  }

  toggle.addEventListener('click',()=>{
    setOpen(toggle.getAttribute('aria-expanded')!=='true');
  });

  const selectIds=['locationFilter','currencyFilter','statusFilter'];
  selectIds.forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('change',()=>{
      syncFilterBadge();
      setTimeout(()=>setOpen(false),180);
    });
  });

  ['searchBox','customerFilter'].forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('input',syncFilterBadge);
    el.addEventListener('change',()=>{
      syncFilterBadge();
      if(String(el.value||'').trim())setTimeout(()=>setOpen(false),180);
    });
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'){
        event.preventDefault();
        syncFilterBadge();
        setOpen(false);
        el.blur();
      }
    });
  });

  compactRefresh.addEventListener('click',()=>setOpen(false));

  syncFilterBadge();
  doc.documentElement.dataset.bbArHeaderV2='1';
  return true;
}

function tryEnhance(){
  try{
    const shellDoc=shellFrame.contentDocument||shellFrame.contentWindow.document;
    if(!shellDoc)return false;

    nestedFrame=shellDoc.getElementById('arMobileFrame');
    if(!nestedFrame)return false;

    const doc=innerDocument();
    if(!doc?.head||!doc?.body)return false;

    const ok=enhanceHeaderAndFilters(doc);
    if(ok||doc.documentElement.dataset.bbArHeaderV2==='1'){
      boot.classList.add('hide');
      return true;
    }
  }catch(error){
    console.warn('BIG BROTHER receivable header enhancement:',error);
  }
  return false;
}

function scheduleEnhance(){
  [60,220,500,900,1500,2400].forEach(delay=>setTimeout(tryEnhance,delay));
}

shellFrame.addEventListener('load',()=>{
  try{
    const shellDoc=shellFrame.contentDocument||shellFrame.contentWindow.document;
    nestedFrame=shellDoc?.getElementById('arMobileFrame')||null;
    if(nestedFrame&&!nestedFrame.dataset.bbOuterWatch){
      nestedFrame.dataset.bbOuterWatch='1';
      nestedFrame.addEventListener('load',scheduleEnhance);
    }
  }catch(_){}
  scheduleEnhance();
});

})();
</script>
</body>
</html>
