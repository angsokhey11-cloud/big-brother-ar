function inject(){
  let doc;
  try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}
  if(!doc||!doc.head)return;
  let style=doc.getElementById('bb-mobile-receivable-skin');
  if(!style){style=doc.createElement('style');style.id='bb-mobile-receivable-skin';doc.head.appendChild(style)}
  style.textContent=MOBILE_CSS;
  try{
    const win=frame.contentWindow;
    const keepFresh=()=>{
      const body=doc.getElementById('arBody');
      if(!body)return;
      body.querySelectorAll('tr').forEach(tr=>{
        const c=tr.children;if(c.length<11)return;
        c[1].title=String(c[1].textContent||'').trim();
        c[2].title='Invoice date';
        c[3].title='Due date';
        c[4].title=String(c[4].textContent||'').trim();
      });
    };
    keepFresh();
    const body=doc.getElementById('arBody');
    if(body&&!body.__bbObserved){body.__bbObserved=true;new win.MutationObserver(()=>win.requestAnimationFrame(keepFresh)).observe(body,{childList:true,subtree:true})}
  }catch(_){ }
  boot.classList.add('hide');
}
frame.addEventListener('load',()=>{setTimeout(inject,60);setTimeout(inject,400);setTimeout(inject,1200)});
})();
</script>
