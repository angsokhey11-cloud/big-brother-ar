function extractOldMobileCss(text){
  const marker='const MOBILE_CSS = `';
  const start=text.indexOf(marker);
  if(start<0)return'';
  const bodyStart=start+marker.length;
  const end=text.indexOf('\n`;',bodyStart);
  return end>bodyStart?text.slice(bodyStart,end):'';
}

async function loadCardCss(){
  try{
    const cached=localStorage.getItem(CARD_CSS_CACHE);
    if(cached)return cached;
  }catch(_){ }

  try{
    const res=await fetch('your-receivable-mobile-cards-v1.html?v=20260914-1',{cache:'force-cache'});
    if(!res.ok)throw new Error('card skin fetch failed');
    const text=await res.text();
    const css=extractOldMobileCss(text);
    if(css){
      try{localStorage.setItem(CARD_CSS_CACHE,css)}catch(_){ }
      return css;
    }
  }catch(error){
    console.warn('BIG BROTHER card skin cache:',error);
  }
  return'';
}

const cardCssPromise=loadCardCss();

/* Four-column mobile Summary Invoice for both A/R routes.
 * The original selected invoice dataset and financial calculations are
 * unchanged; only the mobile summary paper/table (and its exports) change.
 */
function formatSummaryShortDate(value){
  const raw=String(value||'').trim();
  let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:$|[T\s])/);
  if(m)return m[3].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[1].slice(-2);
  m=raw.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2}|\d{4})$/);
  if(m)return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[3].slice(-2);
  m=raw.match(/^(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s](\d{2}|\d{4})$/);
  if(m){
    const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const mm=months.indexOf(m[2].slice(0,3).toLowerCase())+1;
    if(mm)return m[1].padStart(2,'0')+'-'+String(mm).padStart(2,'0')+'-'+m[3].slice(-2);
  }
  return raw;
}
function cleanSummaryTable(doc){
  const table=doc.querySelector('#summarySheet .sum-table');
  if(!table||table.dataset.bbFourSummary==='1')return;
  const head=table.querySelector('thead tr'),body=table.querySelector('tbody');
  if(!head||!body)return;
  const headings=[...head.children].map(el=>String(el.textContent||'').toLowerCase().replace(/\s+/g,' ').trim());
  const index=(label)=>headings.findIndex(text=>text===label);
  const date=index('date'),invoice=index('invoice no'),customer=index('customer'),outstanding=index('outstanding');
  if(date<0||invoice<0||outstanding<0)return;
  // Single-customer summaries previously omitted the Customer column.
  const singleName=String(doc.querySelector('#summarySheet .sum-customer-name')?.textContent||'').trim();
  const columns=[['Date',date],['Invoice No',invoice],['Customer',customer],['Outstanding',outstanding]];
  const header=doc.createElement('tr');
  const widths=['19%','23%','36%','22%'];
  columns.forEach(([label],i)=>{
    const th=doc.createElement('th');
    th.textContent=label;
    th.style.width=widths[i];
    if(i===3)th.className='money';
    header.appendChild(th);
  });
  const rows=[...body.querySelectorAll('tr')].map(row=>{
    const cells=[...row.children];
    const tr=doc.createElement('tr');
    columns.forEach(([label,sourceIndex],i)=>{
      const source=sourceIndex>=0?cells[sourceIndex]:null;
      const td=source?source.cloneNode(true):doc.createElement('td');
      td.removeAttribute('style');
      if(i===0)td.textContent=formatSummaryShortDate(source?.textContent);
      // Keep invoice numbers as normal-weight text, like customer names.
      // Outstanding stays bold, including in the A4 PDF/print source.
      if(i===1){
        td.textContent=String(source?.textContent||'').trim();
        td.style.fontWeight='400';
      }
      if(i===2&&sourceIndex<0)td.textContent=singleName;
      if(i===3)td.classList.add('money');
      tr.appendChild(td);
    });
    return tr;
  });
  // Mark BEFORE changing children; the Summary MutationObserver must not loop.
  table.dataset.bbFourSummary='1';
  head.replaceWith(header);
  body.replaceChildren(...rows);
}

/* BIG BROTHER Mobile Summary V3: one compact toolbar and a readable
 * phone-width preview. The original A4 #summarySheet remains the untouched
 * export/print source; existing PDF, photo and Telegram handlers are reused.
 */
/* Original A4 Summary Invoice visual, enlarged to the available mobile width.
 * No card redesign or reformatting; the unchanged source A4 DOM is used
 * for PDF and printing. The on-screen paper is a faithful visual clone. */
function fitSummaryToPhone(doc){
 const sheet=doc.getElementById('summarySheet');
 const overlay=doc.getElementById('summaryOverlay');
 if(!sheet||!overlay||overlay.classList.contains('hidden'))return;
 const spacer=doc.getElementById('bb-summary-height-spacer');
 if(spacer)spacer.remove();
 const copy=sheet.cloneNode(true);
 copy.id='bbArSummaryPaper';
 copy.removeAttribute('style');
 copy.setAttribute('aria-label','Invoice summary paper preview');
 const before=doc.getElementById('bbArSummaryPaper');
 if(before)before.replaceWith(copy);
 else sheet.parentNode.insertBefore(copy,sheet);
 const table=copy.querySelector('.sum-table');
 if(table&&table.querySelectorAll('thead th').length===4)copy.classList.add('bb-ar-paper-four');
}
function wireSummaryMoreFunction(doc,win){
 const actions=doc.querySelector('#summaryOverlay .summary-actions');
 if(!actions)return;
 const modal=actions.closest('.summary-modal');
 if(!modal)return;
 if(actions.__bbMoreFunctionReady)return;

function activeFilterCount(doc){
  const others=['searchBox','locationFilter','currencyFilter','statusFilter',
    'arFromDateFilter','arToDateFilter','arMinAmountFilter','arMaxAmountFilter']
    .map(id=>doc.getElementById(id))
    .filter(el=>el&&String(el.value||'').trim()).length;
  const customerFiltered=doc.defaultView?.BBARCustomerExcelV1?.isFiltered?.()===true;
  const typed=String(doc.getElementById('customerFilter')?.value||'').trim();
  return others+(customerFiltered||typed?1:0)+
    (doc.getElementById('arDateFieldFilter')?.value==='dueDate'?1:0);
}

function buildFilterUI(doc,win){
  const filters=doc.querySelector('.filters');
  if(!filters||doc.getElementById('bbFilterToggle'))return;

  const summary=doc.getElementById('summaryBtn');
  const batch=doc.getElementById('batchBtn');
  const refresh=[...filters.querySelectorAll('button')].find(btn=>String(btn.getAttribute('onclick')||'').includes('loadAR(true)'));
  if(!summary||!batch||!refresh)return;

  const bar=doc.createElement('div');
  bar.className='bb-mobile-actionbar';

  const filterBtn=doc.createElement('button');
  filterBtn.id='bbFilterToggle';
  filterBtn.className='bb-filter-toggle';
  filterBtn.type='button';

  refresh.classList.add('bb-refresh-btn');
  refresh.textContent='↻';
  refresh.setAttribute('aria-label','Refresh receivables');

  filters.parentNode.insertBefore(bar,filters);
  bar.append(filterBtn,summary,batch,refresh);

  filters.classList.add('bb-mobile-filter-panel');
  // Keep the date/amount row inside the same mobile drawer, not as a
  // permanently visible bar that crowds small phone screens.
  const range=doc.querySelector('.ar-range-collapse');
  if(range)filters.append(range);
  // Shorter text fits three native dropdowns on one phone row.
  const locationChoice=doc.querySelector('#locationFilter option[value=""]');
  if(locationChoice)locationChoice.textContent='All locations';

  const head=doc.createElement('div');
  head.className='bb-filter-head';
  head.innerHTML='<div><strong>Filters</strong><br><span>Invoice · Customer · Date · Amount · Location</span></div><button type="button" class="bb-filter-close" aria-label="Close filters">×</button>';
  filters.prepend(head);

  const clear=doc.createElement('button');
  clear.type='button';
  clear.className='bb-filter-clear';
  clear.textContent='Clear Filters';
  filters.appendChild(clear);

  const backdrop=doc.createElement('div');
  backdrop.className='bb-filter-backdrop';
  doc.body.appendChild(backdrop);

  function syncFilterButton(){
    const n=activeFilterCount(doc);
    filterBtn.textContent=n?'⚙ Filters · '+n:'⚙ Filters';
    filterBtn.classList.toggle('active',n>0);
  }

  function openFilters(){
    filters.classList.add('open');
    backdrop.classList.add('open');
  }

  function closeFilters(){
    filters.classList.remove('open');
    backdrop.classList.remove('open');
    syncFilterButton();
  }

  filterBtn.addEventListener('click',openFilters);
  backdrop.addEventListener('click',closeFilters);
  head.querySelector('.bb-filter-close').addEventListener('click',closeFilters);

  ['locationFilter','currencyFilter','statusFilter'].forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('change',()=>{
      syncFilterButton();
      // Keep drawer open while staff choose multiple filter dimensions.
    });
  });

  ['searchBox','customerFilter'].forEach(id=>{
    const el=doc.getElementById(id);
    if(!el)return;
    el.addEventListener('input',syncFilterButton);
    el.addEventListener('change',()=>{
      syncFilterButton();
      if(id==='searchBox')setTimeout(closeFilters,120);
    });
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'){
        syncFilterButton();
        closeFilters();
        try{el.blur()}catch(_){ }
      }
    });
  });

  doc.addEventListener('bb-ar-customer-scope-changed',syncFilterButton);
  ['arDateFieldFilter','arFromDateFilter','arToDateFilter','arMinAmountFilter','arMaxAmountFilter'].forEach(id=>{
    const field=doc.getElementById(id);
    if(!field)return;
    field.addEventListener('input',syncFilterButton);
    field.addEventListener('change',syncFilterButton);
  });

  clear.addEventListener('click',()=>{
    ['searchBox','customerFilter','locationFilter','currencyFilter','statusFilter',
      'arFromDateFilter','arToDateFilter','arMinAmountFilter','arMaxAmountFilter'].forEach(id=>{
      const el=doc.getElementById(id);
      if(el)el.value='';
    });
    const dateKind=doc.getElementById('arDateFieldFilter');
    if(dateKind)dateKind.value='invoiceDate';
    try{win.BBARCustomerExcelV1?.clearSelection?.()}catch(_){ }
    try{if(typeof win.filterChanged==='function')win.filterChanged()}catch(_){ }
    syncFilterButton();
    closeFilters();
  });

  syncFilterButton();
}


function wireMobileCardSelectAll(doc,win){
  // All and Your Receivable mobile use the same invoice-card skin. Reuse
  // the actual A/R Select All implementation so processing invoices,
  // filters, Summary Invoice and Receive Selected retain existing rules.
  const body=doc.getElementById('arBody');
  const table=body?.closest('.tablewrap');
  if(!body||!table||doc.getElementById('bbMobileCardSelectAll'))return;

  const bar=doc.createElement('div');
  bar.className='bb-mobile-card-select-all';
  bar.id='bbMobileCardSelectAll';
  const label=doc.createElement('label');
  const checkbox=doc.createElement('input');
  checkbox.type='checkbox';
  checkbox.id='bbMobileCardSelectAllBox';
  checkbox.setAttribute('aria-label','Select all visible eligible receivable invoices');
  const title=doc.createElement('span');
  title.textContent='Select all shown';
  label.append(checkbox,title);
  const count=doc.createElement('span');
  count.id='bbMobileCardSelectionCount';
  count.className='bb-mobile-card-selection-count';
  count.setAttribute('aria-live','polite');
  bar.append(label,count);
  table.parentNode.insertBefore(bar,table);

  function syncSelection(){
    // The already-filtered cards are the source of truth. Processing cards
    // are disabled by A/R and never included in Select All.
    const eligible=[...body.querySelectorAll('input.rowcheck:not(:disabled)')];
    const selected=eligible.filter(el=>el.checked).length;
    checkbox.disabled=eligible.length===0;
    checkbox.checked=eligible.length>0&&selected===eligible.length;
    checkbox.indeterminate=selected>0&&selected<eligible.length;
    count.textContent=selected+' / '+eligible.length+' selected';
    title.textContent=eligible.length?'Select all shown ('+eligible.length+')':'No selectable invoices';
  }

  checkbox.addEventListener('change',()=>{
    if(typeof win.toggleSelectAll==='function'){
      win.toggleSelectAll(checkbox.checked);
      syncSelection();
    }else{
      checkbox.checked=false;
      count.textContent='Selection unavailable';
    }
  });
  // Re-rendering changes the cards when a filter, refresh, or bulk selection
  // changes. Individual card checkbox clicks do not re-render: listen for
  // their bubbling change event as well.
  body.addEventListener('change',event=>{
    if(event.target?.matches?.('input.rowcheck'))syncSelection();
  });
  new win.MutationObserver(syncSelection).observe(body,{childList:true});
  doc.addEventListener('bb-ar-customer-scope-changed',syncSelection);
  syncSelection();
}

function wireSummary(doc,win){
  wireSummaryMoreFunction(doc,win);
  const sheet=doc.getElementById('summarySheet');
  if(sheet&&!sheet.__bbFastMobileObserved){
    sheet.__bbFastMobileObserved=true;
    new win.MutationObserver(()=>{
      win.requestAnimationFrame(()=>{
        cleanSummaryTable(doc);
        setTimeout(()=>fitSummaryToPhone(doc),20);
      });
    }).observe(sheet,{childList:true,subtree:true});
  }

  const overlay=doc.getElementById('summaryOverlay');
  if(overlay&&!overlay.__bbFastMobileObserved){
    overlay.__bbFastMobileObserved=true;
    new win.MutationObserver(()=>{
      if(!overlay.classList.contains('hidden')){
        cleanSummaryTable(doc);
        setTimeout(()=>fitSummaryToPhone(doc),40);
      }
    }).observe(overlay,{attributes:true,attributeFilter:['class']});
  }
}

async function enhance(){
  let doc,win;
  try{
    doc=frame.contentDocument||frame.contentWindow.document;
    win=frame.contentWindow;
  }catch(_){return false}
  if(!doc||!doc.head||!doc.getElementById('arBody'))return false;

  // Put the real mobile toolbar on screen immediately, even if the older
  // card-skin file is still downloading or unavailable offline.
  wireSummaryMoreFunction(doc,win);
  const cardCss=await cardCssPromise;

  let cardStyle=doc.getElementById('bb-mobile-receivable-skin');
  if(!cardStyle){
    cardStyle=doc.createElement('style');
    cardStyle.id='bb-mobile-receivable-skin';
    doc.head.appendChild(cardStyle);
  }
  if(cardCss)cardStyle.textContent=cardCss;

  let headerStyle=doc.getElementById('bb-mobile-receivable-header-v2');
  if(!headerStyle){
    headerStyle=doc.createElement('style');
    headerStyle.id='bb-mobile-receivable-header-v2';
    doc.head.appendChild(headerStyle);
  }
  headerStyle.textContent=HEADER_FILTER_CSS;
  // Keep the preview's stronger mobile-specific rules last in the cascade.
  const summaryStyle=doc.getElementById('bb-ar-mobile-summary-v4');
  if(summaryStyle)doc.head.appendChild(summaryStyle);

  buildFilterUI(doc,win);
  wireMobileCardSelectAll(doc,win);
  wireSummary(doc,win);
  cleanSummaryTable(doc);

  boot.classList.add('hide');
  return true;
}

function scheduleEnhance(){
  let tries=0;
  const run=async()=>{
    tries++;
    const ok=await enhance();
    if(!ok&&tries<20)setTimeout(run,100);
  };
  run();
}

frame.addEventListener('load',scheduleEnhance);
setTimeout(scheduleEnhance,120);
