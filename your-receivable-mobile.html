function cleanSummary(doc){const sheet=doc.getElementById('summarySheet');if(!sheet)return;const table=sheet.querySelector('.sum-table');if(!table)return;const head=table.querySelector('thead tr');if(head&&head.children.length===7){const label=String(head.children[3].textContent||'').trim().toLowerCase();if(label.includes('due')){head.children[3].remove();table.querySelectorAll('tbody tr').forEach(tr=>{if(tr.children.length===7)tr.children[3].remove();});}}}
function fitSummary(doc){const overlay=doc.getElementById('summaryOverlay');const modal=overlay?.querySelector('.summary-modal');if(!overlay||!modal||overlay.classList.contains('hidden'))return;const available=Math.max(280,modal.clientWidth-16);const scale=Math.min(1,available/794);overlay.style.setProperty('--bb-summary-scale',String(scale));}
function inject(){let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}if(!doc||!doc.head)return;let style=doc.getElementById('bb-mobile-receivable-skin');if(!style){style=doc.createElement('style');style.id='bb-mobile-receivable-skin';doc.head.appendChild(style)}style.textContent=MOBILE_CSS;try{const win=frame.contentWindow;const refresh=()=>{const body=doc.getElementById('arBody');if(body){body.querySelectorAll('tr').forEach(tr=>{const c=tr.children;if(c.length<11)return;c[1].title=String(c[1].textContent||'').trim();c[2].title='Invoice date';c[3].title='Due date';c[4].title=String(c[4].textContent||'').trim();});}cleanSummary(doc);fitSummary(doc);};refresh();const body=doc.getElementById('arBody');if(body&&!body.__bbObserved){body.__bbObserved=true;new win.MutationObserver(()=>win.requestAnimationFrame(refresh)).observe(body,{childList:true,subtree:true})}const summary=doc.getElementById('summarySheet');if(summary&&!summary.__bbObserved){summary.__bbObserved=true;new win.MutationObserver(()=>win.requestAnimationFrame(refresh)).observe(summary,{childList:true,subtree:true})}const overlay=doc.getElementById('summaryOverlay');if(overlay&&!overlay.__bbObserved){overlay.__bbObserved=true;new win.MutationObserver(()=>win.requestAnimationFrame(refresh)).observe(overlay,{attributes:true,attributeFilter:['class']})}win.addEventListener('resize',()=>win.requestAnimationFrame(()=>fitSummary(doc)));}catch(_){ }boot.classList.add('hide');}
frame.addEventListener('load',()=>{setTimeout(inject,60);setTimeout(inject,400);setTimeout(inject,1200)});
})();
