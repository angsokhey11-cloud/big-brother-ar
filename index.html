<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Account Receivable Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Accounts Receivable…<div class="bb-sub">Supabase user permissions</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v3.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Accounts Receivable source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-ar-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Accounts Receivable source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    html=html.replaceAll("if(!admin)return setPaymentError('Admin Code is required to approve payment.');",'');
    html=html.replaceAll("if(!admin)return setBatchError('Admin Code is required to approve the whole batch.');",'');
    html=html.replaceAll("$('singleAdminField').style.display=requesting?'none':'block';","$('singleAdminField').style.display='none';");
    html=html.replaceAll("$('batchAdminField').style.display=requesting?'none':'block';","$('batchAdminField').style.display='none';");
    html=html.replaceAll('✓ Approve & Save Payment','✓ Save Payment');
    html=html.replaceAll('✓ Approve & Clear Selected Invoices','✓ Clear Selected Invoices');

    const marker=`configureView();\n// V3.10: fast refresh restore -> remembered-device fallback -> manual login.\nrestoreSession();`;
    const replacement=`configureView();\n// SUPABASE AUTH CUTOVER\napiPost=window.BBARAdapter.apiPost;\ngetMasterCustomerContact_=async function(row){\n  return {phone:String(row?.customerPhone||''),address:String(row?.customerAddress||'')};\n};\nlogout=async function(){\n  await window.BBARAdapter.signOut();\n  location.reload();\n};\n(async function(){\n  try{\n    await window.BBARAdapter.ensureSession();\n    const access=await window.BBARAdapter.accessProfile();\n    sessionToken='SUPABASE_AUTH';\n    deviceToken='';\n    sessionProfile=access;\n    try{sessionStorage.removeItem(SESSION_KEY);}catch(_){}\n    try{localStorage.removeItem(DEVICE_KEY);localStorage.removeItem(DEVICE_KEY+'_saved_at');}catch(_){}\n    $('loginOverlay').classList.add('hidden');\n    $('logoutBtn').hidden=false;\n    applyProfile(access);\n    await loadAR(true);\n    startSync();\n  }catch(error){\n    sessionToken='';\n    sessionProfile=null;\n    $('logoutBtn').hidden=true;\n    $('loginOverlay').classList.remove('hidden');\n    $('loginTitle').textContent='🔐 Supabase Sign In Required';\n    $('loginText').textContent='Sign in to BIG BROTHER with an account that has Accounts Receivable access.';\n    const codeField=$('accessCode')?.closest('.field');if(codeField)codeField.style.display='none';\n    const rememberRow=$('rememberDevice')?.closest('.remember-row');if(rememberRow)rememberRow.style.display='none';\n    $('loginBtn').style.display='none';\n    setLoginError(error?.message||'Accounts Receivable access denied.');\n  }\n})();`;
    if(!html.includes(marker))throw new Error('Accounts Receivable initialization marker was not found.');
    html=html.replace(marker,replacement);

    html=html.replace('<title>BIG BROTHER - Account Receivable</title>','<title>BIG BROTHER — Account Receivable Supabase</title>');
    html=html.replaceAll('Secure Credit receivable access.','Secure Supabase receivable access.');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Accounts Receivable<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
