<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Account Receivable Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Accounts Receivable…<div class="bb-sub">Supabase user permissions</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v3.html?v=20260910-3',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Accounts Receivable source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-ar-adapter.js?v=20260915-ar-all-public-1"></scr'+'ipt>\n'
      +'<scr'+'ipt src="receivable-backup-v1.js?v=20260916-5"></scr'+'ipt>\n'
      +'<scr'+'ipt src="receivable-telegram-v1.js?v=20260920-artelegram1"></scr'+'ipt>';
    const authCutover='<style id="bb-ar-auth-cutover">#singleAdminField,#batchAdminField{display:none!important}</style>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Accounts Receivable source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+authCutover+'\n'+html.slice(headClose);

    html=html.replace(/<div class="overlay" id="loginOverlay">[\s\S]*?<\/div>\s*<\/div>\s*(?=<div class="overlay hidden" id="paymentOverlay">)/,'');
    html=html.replaceAll('For Bank payment, duplicate Transaction ID will be rejected by the server. The Admin Code is verified server-side and is never saved into Payments.','For Bank payment, duplicate Transaction ID will be rejected by the server. Authorization is verified through your Supabase user permissions.');
    html=html.replaceAll('One payment, one Admin approval, and one Bank Transaction ID can clear all selected invoices. The server recalculates every outstanding balance before saving.','One payment and one Bank Transaction ID can clear all selected invoices. Supabase permissions and current outstanding balances are verified before saving.');
    html=html.replaceAll("if(!admin)return setPaymentError('Admin Code is required to approve payment.');",'');
    html=html.replaceAll("if(!admin)return setBatchError('Admin Code is required to approve the whole batch.');",'');
    html=html.replaceAll("$('singleAdminField').style.display=requesting?'none':'block';","$('singleAdminField').style.display='none';");
    html=html.replaceAll("$('batchAdminField').style.display=requesting?'none':'block';","$('batchAdminField').style.display='none';");
    html=html.replaceAll('✓ Approve & Save Payment','✓ Save Payment');
    html=html.replaceAll('✓ Approve & Clear Selected Invoices','✓ Clear Selected Invoices');

    const marker=`configureView();\n// V3.10: fast refresh restore -> remembered-device fallback -> manual login.\nrestoreSession();`;
    const replacement=`// SUPABASE AUTH CUTOVER — no Admin/Salesman code screen.\n$('summaryBtn').hidden=false;\n$('batchBtn').hidden=false;\n$('selectHead').hidden=false;\nif(VIEW==='all'){\n  $('pageTitle').textContent='All Receivable';\n  $('pageSubtitle').textContent='Company-wide Credit invoices from all active Location Codes.';\n  $('viewBanner').textContent='All Receivable = permission-controlled company receivables. USD and KHR are tracked separately.';\n}else{\n  $('pageTitle').textContent='Your Receivable';\n  $('pageSubtitle').textContent='Credit invoices from your assigned Location Codes.';\n  $('viewBanner').textContent='Your Receivable = only Credit invoices from your assigned Location Codes. USD and KHR are tracked separately.';\n}\nconst bbArRawApiPost=window.BBARAdapter.apiPost;\napiPost=async function(params){\n  const result=await bbArRawApiPost(params);\n  try{\n    if(window.BBReceivableBackupV2&&typeof window.BBReceivableBackupV2.handle==='function'){\n      window.BBReceivableBackupV2.handle(params,result).catch(error=>console.warn('BIG BROTHER receivable backup:',error));\n    }\n  }catch(error){\n    console.warn('BIG BROTHER receivable backup failed without blocking payment:',error);\n  }\n  try{\n    if(window.BBReceivableTelegram&&typeof window.BBReceivableTelegram.handle==='function'){\n      window.BBReceivableTelegram.handle(params,result);\n    }\n  }catch(error){\n    console.warn('BIG BROTHER receivable Telegram event:',error);\n  }\n  return result;\n};\ngetMasterCustomerContact_=async function(row){return {phone:String(row?.customerPhone||''),address:String(row?.customerAddress||'')}};\nconst bbLegacyApplyProfile=applyProfile;\napplyProfile=function(p){bbLegacyApplyProfile(p);if(VIEW==='all'){const locs=Array.isArray(p?.locations)?p.locations:[];const name=p?.adminName||p?.salesmanName||p?.email||'Authorized User';$('accessPill').textContent=(p?.role==='admin'?'🛡️ ':'👤 ')+name;$('locationPill').textContent='📍 '+locs.length+' active location'+(locs.length===1?'':'s');$('pageTitle').textContent='All Receivable';$('pageSubtitle').textContent='Company-wide Credit invoices from all active Location Codes.';$('viewBanner').textContent='All Receivable = permission-controlled company receivables. USD and KHR are tracked separately.';}};\nlogout=async function(){await window.BBARAdapter.signOut();const target='https://angsokhey11-cloud.github.io/big-brother-dashboard/';try{if(window.top&&window.top!==window)window.top.location.replace(target);else window.location.replace(target);}catch(_){window.location.href=target;}};\n(async function(){try{await window.BBARAdapter.ensureSession();const access=await window.BBARAdapter.accessProfile();sessionToken='SUPABASE_AUTH';deviceToken='';sessionProfile=access;try{sessionStorage.removeItem(SESSION_KEY);}catch(_){}try{localStorage.removeItem(DEVICE_KEY);localStorage.removeItem(DEVICE_KEY+'_saved_at');}catch(_){}$('logoutBtn').hidden=false;applyProfile(access);await loadAR(true);startSync();}catch(error){sessionToken='';sessionProfile=null;$('logoutBtn').hidden=true;const target='https://angsokhey11-cloud.github.io/big-brother-dashboard/';try{if(window.top&&window.top!==window)window.top.location.replace(target);else window.location.replace(target);}catch(_){window.location.href=target;}}})();`;
    if(!html.includes(marker))throw new Error('Accounts Receivable initialization marker was not found.');
    html=html.replace(marker,replacement);
    html=html.replace('<title>BIG BROTHER - Account Receivable</title>','<title>BIG BROTHER — Account Receivable Supabase</title>');
    html=html.replaceAll('Secure Credit receivable access.','Secure Supabase receivable access.');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Accounts Receivable<div class="bb-sub">'+String(error && error.message || error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
