/* =========================================================
   REMOVE DUE DATE FROM SUMMARY TABLE
   ========================================================= */

function cleanSummaryTable(doc){

  const sheet = doc.getElementById('summarySheet');

  if(!sheet){
    return;
  }

  const table = sheet.querySelector('.sum-table');

  if(!table){
    return;
  }

  /*
   Base summary currently creates:
   1 # 
   2 Invoice No
   3 Date
   4 Due Date
   5 Grand Total
   6 Paid
   7 Outstanding

   Remove column 4 completely.
  */

  table.querySelectorAll('tr').forEach(function(row){

    if(row.children.length >= 7){

      const dueCell = row.children[3];

      if(dueCell){
        dueCell.remove();
      }

    }

  });

}


/* =========================================================
   SCALE A4 SUMMARY TO PHONE WIDTH
   WITHOUT DESTROYING DOCUMENT FORMAT
   ========================================================= */

function fitSummaryToPhone(doc){

  const overlay = doc.getElementById('summaryOverlay');
  const sheet   = doc.getElementById('summarySheet');

  if(
    !overlay ||
    !sheet ||
    overlay.classList.contains('hidden')
  ){
    return;
  }

  /*
   210mm at browser CSS conversion is roughly 794px.
  */

  const documentWidth = 794;

  const availableWidth =
    Math.max(
      280,
      doc.documentElement.clientWidth - 16
    );

  const scale =
    Math.min(
      1,
      availableWidth / documentWidth
    );

  sheet.style.transformOrigin = 'top left';
  sheet.style.transform = 'scale(' + scale + ')';

  /*
   Prevent giant blank space caused by transform.
  */

  const naturalHeight =
    sheet.scrollHeight || 1123;

  const modal =
    sheet.closest('.summary-modal');

  if(modal){

    let holder =
      doc.getElementById(
        'bb-summary-height-spacer'
      );

    if(!holder){

      holder =
        doc.createElement('div');

      holder.id =
        'bb-summary-height-spacer';

      holder.style.width =
        '1px';

      holder.style.pointerEvents =
        'none';

      sheet.insertAdjacentElement(
        'afterend',
        holder
      );

    }

    holder.style.height =
      Math.ceil(
        naturalHeight * scale
      ) + 'px';

    holder.style.marginTop =
      Math.ceil(
        naturalHeight * scale -
        naturalHeight
      ) + 'px';

  }

}


/* =========================================================
   INJECT MOBILE CSS
   ========================================================= */

function inject(){

  let doc;

  try{

    doc =
      frame.contentDocument ||
      frame.contentWindow.document;

  }
  catch(error){

    return;

  }

  if(
    !doc ||
    !doc.head
  ){
    return;
  }


  let style =
    doc.getElementById(
      'bb-mobile-receivable-skin'
    );


  if(!style){

    style =
      doc.createElement('style');

    style.id =
      'bb-mobile-receivable-skin';

    doc.head.appendChild(style);

  }


  style.textContent =
    MOBILE_CSS;


  try{

    const win =
      frame.contentWindow;


    /*
    Receivable Card Observer
    */

    const body =
      doc.getElementById('arBody');


    if(
      body &&
      !body.__bbMobileObserved
    ){

      body.__bbMobileObserved = true;


      new win.MutationObserver(
        function(){

          win.requestAnimationFrame(
            function(){

              body
                .querySelectorAll('tr')
                .forEach(function(tr){

                  const cells =
                    tr.children;


                  if(cells.length < 11){
                    return;
                  }


                  cells[1].title =
                    String(
                      cells[1].textContent || ''
                    ).trim();


                  cells[4].title =
                    String(
                      cells[4].textContent || ''
                    ).trim();

                });

            }
          );

        }
      )
      .observe(
        body,
        {
          childList:true,
          subtree:true
        }
      );

    }


    /*
    Summary Observer
    */

    const summarySheet =
      doc.getElementById(
        'summarySheet'
      );


    if(
      summarySheet &&
      !summarySheet.__bbSummaryObserved
    ){

      summarySheet.__bbSummaryObserved =
        true;


      new win.MutationObserver(
        function(){

          win.requestAnimationFrame(
            function(){

              cleanSummaryTable(doc);

              setTimeout(
                function(){
                  fitSummaryToPhone(doc);
                },
                30
              );

            }
          );

        }
      )
      .observe(
        summarySheet,
        {
          childList:true,
          subtree:true
        }
      );

    }


    /*
    Watch overlay open / close
    */

    const summaryOverlay =
      doc.getElementById(
        'summaryOverlay'
      );


    if(
      summaryOverlay &&
      !summaryOverlay.__bbOverlayObserved
    ){

      summaryOverlay.__bbOverlayObserved =
        true;


      new win.MutationObserver(
        function(){

          if(
            !summaryOverlay.classList.contains(
              'hidden'
            )
          ){

            cleanSummaryTable(doc);

            setTimeout(
              function(){

                fitSummaryToPhone(doc);

              },
              60
            );

          }

        }
      )
      .observe(
        summaryOverlay,
        {
          attributes:true,
          attributeFilter:[
            'class'
          ]
        }
      );

    }


    /*
    Initial clean
    */

    cleanSummaryTable(doc);

  }
  catch(error){

    console.warn(
      'BIG BROTHER mobile enhancement:',
      error
    );

  }


  boot.classList.add('hide');

}


/* =========================================================
   IFRAME LOAD
   ========================================================= */

frame.addEventListener(
  'load',
  function(){

    setTimeout(
      inject,
      60
    );

    setTimeout(
      inject,
      400
    );

    setTimeout(
      inject,
      1200
    );

  }
);

})();
</script>
